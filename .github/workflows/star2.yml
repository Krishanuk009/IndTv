name: Update Star Sports 2 Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
    paths:
      - 'star2.py'

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
          # Or if you have requirements.txt:
          # pip install -r requirements.txt

      - name: Run star2.py
        run: python star2.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Krishanuk009"
          git config --global user.email "271363488+Krishanuk009@users.noreply.github.com"

          git add Star2.m3u
          git commit -m "Auto-update playlists: $(date -u)" || echo "No changes to commit"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push failed, retrying ($i)..."
            sleep $((RANDOM % 10 + 1))
          done
