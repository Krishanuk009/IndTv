name: Update MIXIPTV Playlist

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mixiptv.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: update-jtv2
      cancel-in-progress: true

    env:
      TZ: Asia/Kolkata                # sets timezone for commit message

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Krishanuk009"
          git config --global user.email "271363488+Krishanuk009@users.noreply.github.com"

      - name: Fetch and Reset to Remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Script
        run: |
          python mixiptv.py

      - name: Commit and Push Changes
        run: |
          git add mixiptv.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update playlist ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          # Safely incorporate remote changes, keeping our generated file on conflicts
          git pull --rebase -X theirs origin main

          # Push only if the remote hasn't moved since our rebase
          git push --force-with-lease origin main
