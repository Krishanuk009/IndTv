name: Update JTV PLUS 4 Playlist

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'jtvplus4.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: update-jtv2
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Krishanuk009"
          git config --global user.email "271363488+Krishanuk009@users.noreply.github.com"

      - name: Fetch and Reset to Remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Script
        run: |
          python jtvplus4.py

      - name: Commit and Push Changes
        run: |
          git add jtvplus4.m3u
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git commit -m "Auto-update playlist ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          
          # Fetch latest changes again and rebase
          git fetch origin main
          git rebase origin/main
          
          # Push the changes
          git push origin main
